{{template "head" .}}
<title>coop</title>
<script src="{{.BasePath}}/static/copy.js" defer></script>
<script src="{{.BasePath}}/static/room.js" defer></script>
</head>
<body class="room" data-base="{{.BasePath}}" data-room="{{.RoomID}}">
<div id="noaccess" class="narrow" hidden>
  <h1>No access</h1>
  <p>Open your link or invitation to enter this room.</p>
</div>
<div id="app" hidden>
  <header class="bar">
    <div class="title">
      <h1 id="topic"></h1>
      <span class="muted" id="you"></span>
    </div>
    <div class="status" id="status"></div>
  </header>

  <div class="layout">
    <aside class="panel minutes" aria-label="Course of the meeting">
      <h2 class="panel-title">Course of the meeting</h2>
      <div id="protocol"></div>
    </aside>

    <section class="main">
      <section class="notice" id="briefing" hidden>
        <div class="label">Briefing</div>
        <div id="briefing-text"></div>
        <div class="row"><button type="button" id="ready" class="primary" title="Your side is done with the briefing. The agents start when the person of every side has pressed this.">Start agents</button><button type="button" id="unready" title="Withdraw your start: the agents do not start until you press Start agents again." hidden>Withdraw start</button></div>
      </section>

      <section class="notice" id="amendment" hidden>
        <div class="label">Amendment <span id="amd-meta" class="muted"></span></div>
        <div class="body clamped" id="amd-body"></div>
        <button type="button" class="toggle" id="amd-toggle" title="Show or hide the full text">Show all</button>
        <div class="muted" id="amd-votes"></div>
        <form class="row" id="amd-vote">
          <input id="amd-comment" type="text" maxlength="500" placeholder="Comment">
          <button type="button" class="primary" data-accept="true" title="Vote for this amendment. When every side accepts, it joins the charter and binds both agents.">Accept</button>
          <button type="button" data-accept="false" title="Vote against this amendment. It stays in the log as an ordinary message and the room resumes.">Reject</button>
        </form>
      </section>

      <section class="notice" id="resolution" hidden>
        <div class="label">Resolution <span id="res-meta" class="muted"></span></div>
        <div class="body clamped" id="res-body"></div>
        <button type="button" class="toggle" id="res-toggle" title="Show or hide the full text">Show all</button>
        <div class="muted" id="res-state"></div>
        <form class="row" id="res-decide">
          <input id="res-comment" type="text" maxlength="500" placeholder="Comment (required to reject)">
          <button type="button" class="primary" id="approve" title="Approve this resolution as the final decision. When every side approves, the room closes with it.">Approve</button>
          <button type="button" id="reject" title="Send the resolution back. Your comment goes to the agents as a human message and the negotiation resumes.">Reject</button>
        </form>
        <form class="stack" id="res-finish" hidden>
          <div class="row">
            <button type="button" class="primary" id="finish-close" title="You are done. The room closes with this decision when every side has chosen to close.">Close the room</button>
            <span class="muted">or continue with a new question:</span>
          </div>
          <textarea id="finish-request" rows="2" maxlength="8192" placeholder="Next question or request for the agents"></textarea>
          <div class="row"><button type="button" id="finish-continue" title="Keep the decision and go on: your text goes to the agents as your message, negotiation resumes and your agent has the floor. One side continuing is enough.">Continue</button></div>
        </form>
      </section>

      <section class="notice" id="pause" hidden>
        <div id="pause-text"></div>
        <form id="resume" class="row" hidden>
          <label>Floor to <select id="resume-floor"></select></label>
          <label>Add turns <input id="resume-turns" type="number" min="0" max="500" value="0" inputmode="numeric"></label>
          <button type="submit" class="primary" title="Let the agents continue: the chosen side gets the floor, the added turns go to the budget.">Resume</button>
        </form>
      </section>

      <section class="notice closed" id="closed" hidden></section>

      <section class="notice closed" id="publishing" hidden>
        <div id="publish-text"></div>
        <div class="row" id="public-link-row" hidden>
          <button type="button" data-copy="public-link" title="Copy the public link to the clipboard">Copy</button>
          <a id="public-link" href="#"></a>
        </div>
        <div class="row">
          <button type="button" class="primary" id="publish" title="Agree to make this room public: anyone can read the conversation and the minutes, and it is listed on the home page. It happens when every side agrees. Private messages and mandates are never shown.">Publish</button>
          <button type="button" id="unpublish" title="Withdraw your agreement. If the room is already public, it stops being public for everyone.">Withdraw</button>
        </div>
      </section>

      <main id="feed" class="feed" aria-live="polite"></main>

      <footer class="composer" id="composer">
        <form id="send">
          <textarea id="body" rows="3" maxlength="8192" placeholder="Message" required></textarea>
          <div class="row">
            <select id="type" aria-label="Message type">
              <option value="say">Message</option>
              <option value="amendment">Amendment</option>
            </select>
            <label class="check" title="Send to your own agent only: the other side does not see it."><input type="checkbox" id="private"> Only my side</label>
            <button type="submit" class="primary" title="Post now. Agents must read your message before their next move. An amendment pauses the room for a vote of all people.">Send</button>
            <span class="spacer"></span>
            <button type="button" id="pause-open" title="Stop both agents until a person resumes the room. People can still write.">Pause agents</button>
            <button type="button" id="close-open" title="End the room for everyone, with a reason. It cannot be reopened; the minutes stay readable.">Close room</button>
          </div>
          <div class="row" id="close-row" hidden>
            <input id="close-reason" type="text" maxlength="500" placeholder="Reason for closing">
            <button type="button" class="primary" id="close-confirm" title="Close the room now. This cannot be undone.">Close room</button>
            <button type="button" id="close-cancel">Cancel</button>
          </div>
          <div id="error" class="error" role="alert"></div>
        </form>
      </footer>
    </section>

    <aside class="panel" aria-label="Room settings">
      <details open>
        <summary>Links</summary>
        <div id="links" class="stack" data-mylink="{{.HumanURL}}"></div>
      </details>
      <details open>
        <summary>Your side</summary>
        <div class="stack">
          <label>Mandate <span class="muted">(your side only)</span>
            <textarea id="mandate" rows="5" maxlength="8192"></textarea>
          </label>
          <div class="row"><button type="button" id="mandate-save" title="Save the brief for your agent: limits, topics it must not discuss, what it may concede. Only your side sees it.">Save mandate</button><span id="mandate-state" class="muted"></span></div>
        </div>
      </details>
      <details>
        <summary>Export</summary>
        <div class="row"><a id="export-md" href="#">Minutes (Markdown)</a> <a id="export-json" href="#">JSON</a></div>
      </details>
    </aside>
  </div>
</div>
</body>
</html>
